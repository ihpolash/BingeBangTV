<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BingeBang</title>
<link rel="stylesheet" href="./styles.css" />
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="brand-dot"></span>BingeBang <em>mac</em></div>
    <nav>
      <button data-nav="home" class="active">Home</button>
      <button data-nav="movies">Movies</button>
      <button data-nav="tv">TV Shows</button>
      <button data-nav="mylist">My List <span id="nav-list-count" class="pill"></span></button>
      <button data-nav="history">History</button>
    </nav>
    <div class="side-foot">
      <div class="side-hint">Native Mac app<br/>History • Resume • Picks for you</div>
      <button id="btn-clear" title="Clear history">Clear history</button>
      <div class="ver">v1.1.0</div>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div class="trafficpad"></div>
      <div class="searchwrap">
        <input id="search" placeholder="Search movies, shows…  ( / to focus )" autocomplete="off" />
        <div id="search-results"></div>
      </div>
      <div id="status"></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="player-overlay" hidden>
  <div class="player-top">
    <button id="player-back">← Back</button>
    <div id="player-title"></div>
    <div class="player-pickers">
      <select id="server-pick" title="Server"></select>
      <select id="quality-pick" title="Quality"></select>
      <select id="audio-pick" title="Audio language"><option value="">Audio: original</option></select>
      <select id="audiopref-pick" title="Preferred dubbed audio">
        <option value="orig">Dub: off</option>
        <option value="hi">Prefer Hindi dub</option>
        <option value="en">Prefer English dub</option>
        <option value="ta">Prefer Tamil dub</option>
        <option value="te">Prefer Telugu dub</option>
        <option value="bn">Prefer Bengali dub</option>
        <option value="ml">Prefer Malayalam dub</option>
        <option value="ko">Prefer Korean dub</option>
        <option value="es">Prefer Spanish dub</option>
      </select>
      <select id="sub-pick" title="Subtitles"><option value="">No subtitles</option></select>
    </div>
  </div>
  <video id="video" controls playsinline crossorigin="anonymous"></video>
  <div id="player-episodes"></div>
  <div id="player-status"></div>
</div>
<script src="../services/store.js"></script>
<script src="./app.js"></script>
</body>
</html>
